{% extends "classifier/base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 mt-5 reveal">
      <div class="text-center mb-3">
        <div style="font-size:1.5rem">🍱 食品类别分类实训系统</div>
        <div class="small text-muted mt-1">输入食品文本，体验机器学习三级类目智能分类</div>
      </div>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="post" id="loginForm">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="id_username">用户名</label>
          <input id="id_username" class="form-control" name="username" value="{{ username|default:'' }}" autocomplete="username" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="id_password">密码</label>
          <input id="id_password" type="password" class="form-control" name="password" autocomplete="current-password" required>
        </div>
        <button id="loginBtn" class="btn btn-success w-100" type="submit">登录</button>
      </form>
      <div class="mt-3 small text-muted text-center" style="opacity:.8">
        演示账号：student / student123（学生）　admin / admin123（管理员）
      </div>
    </div>
  </div>
</div>
{% endblock %}
