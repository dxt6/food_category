{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination-bar" aria-label="分页导航">
  <span>第 {{ page_obj.number }} / {{ page_obj.paginator.num_pages }} 页 · 共 {{ page_obj.paginator.count }} 条</span>
  <div>
    {% if page_obj.has_previous %}<a class="btn btn-secondary btn-sm" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}"><i class="bi bi-chevron-left"></i>上一页</a>{% endif %}
    {% if page_obj.has_next %}<a class="btn btn-secondary btn-sm" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}">下一页<i class="bi bi-chevron-right"></i></a>{% endif %}
  </div>
</nav>
{% endif %}
