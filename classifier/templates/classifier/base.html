{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}食品类别分类系统{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'app.css' %}" rel="stylesheet">
</head>
<body>
<nav class="ek-nav">
  <div class="container">
    <a class="ek-brand" href="/">
      <span class="ek-logo">🍱</span>
      <span>食品类别分类实训系统</span>
    </a>
    <div class="ek-nav-right">
      {% if user.is_authenticated %}
        <span class="ek-user">{{ user.username }}</span>
        {% if role == 'admin' %}<span class="ek-badge">管理员</span>
        {% else %}<span class="ek-badge">学生</span>{% endif %}
        <a class="btn btn-outline-secondary btn-sm" href="{% url 'logout' %}">退出</a>
      {% endif %}
      <button class="ek-theme-btn" id="ekThemeBtn" type="button" aria-label="切换主题">☾</button>
    </div>
  </div>
</nav>

<main class="container mt-4">
  {% block content %}{% endblock %}
</main>

<footer class="ek-footer">
  基于机器学习的食品类别分类系统 · 轻量化 B/S 实训演示平台 · Django + scikit-learn
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'app.js' %}"></script>
</body>
</html>
